name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain:
          - node: 22.18.0
            npm: 11.6.2
          - node: 24.18.0
            npm: 12.2.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.toolchain.node }}
          cache: npm
      - run: npm install --global npm@${{ matrix.toolchain.npm }}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
