name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/github-script@v9
        id: release
        with:
          script: |
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha },
            );
            return pulls.some(pr =>
              pr.merged_at &&
              pr.merge_commit_sha === context.sha &&
              pr.base.ref === 'main' &&
              pr.base.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              pr.head.ref === 'auto-release' &&
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );

  checks:
    needs: release-merge
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-merge.outputs.skip == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
